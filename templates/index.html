<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phishing URL Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f7f9fc;
        }
        .card {
            margin-top: 50px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .result-box {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card p-4">
            <h2 class="text-center mb-4">🔍 Phishing URL Detector</h2>
            <form method="POST">
                <div class="mb-3">
                    <label for="url" class="form-label">Enter URL to check:</label>
                    <input type="text" class="form-control" id="url" name="url" placeholder="e.g. http://secure-login.com" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Check URL</button>
                </div>
            </form>

            {% if result %}
            <div class="alert alert-{{ 'danger' if result == 'Phishing' else 'success' }} result-box" role="alert">
                <h4 class="alert-heading">Result: {{ result }}</h4>
                <p><strong>Confidence:</strong> {{ confidence }}%</p>
                {% if reasons %}
                <hr>
                <p><strong>Reasons:</strong> {{ reasons }}</p>
                {% endif %}
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
